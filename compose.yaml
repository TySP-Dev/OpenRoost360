# OpenRoost360 — Docker Compose stack.
#
#   docker compose up -d --build     first start (then open https://<server>:8443/ and use the setup code below)
#   docker compose logs openroost    shows the first-time setup code
#   ./update.sh                      update to the newest release (git pull + rebuild); data is kept
#
# Optional services, only if you want OpenRoost to run them for you (set COMPOSE_PROFILES in .env):
#   pihole      OpenRoost's own Pi-hole (skip it if you already run one)
#   mailrelay   a Postfix relay that hands OpenRoost's email to Resend or another SMTP service
#
# Settings live in .env (copy .env.example). Data (database, master key, certificates) lives in ./data:
# back it up, and keep it private.
name: openroost360

services:
  openroost:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # Built locally from this checkout. To use published images instead (see .gitea/workflows), set
    # OPENROOST_IMAGE=git.tysstech.com/tyss-dev/openroost360:latest in .env and run `docker compose pull`.
    image: ${OPENROOST_IMAGE:-openroost360:local}
    container_name: openroost360
    restart: unless-stopped
    # Host networking: the hub's port 443 is redirected (by an iptables rule on this host) to the listener, and
    # OpenRoost manages that rule itself, so it has to share the host's network. (Compose can't combine `dns:` with
    # host networking, which is why the DNS server is chosen with OPENROOST_DNS below instead.)
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]          # only for the port 443 -> listener iptables rule
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /run]
    volumes:
      - ./data:/data
      - ./pihole/dnsmasq.d:/pihole-dnsmasq              # OpenRoost writes its two DNS lines here for its own Pi-hole
    environment:
      TZ: ${TZ:-UTC}
      OPENROOST_HTTPS_PORT: ${OPENROOST_HTTPS_PORT:-8443}
      OPENROOST_HTTP_PORT: ${OPENROOST_HTTP_PORT:-8362}
      OPENROOST_LISTENER_PORT: ${OPENROOST_LISTENER_PORT:-8883}
      OPENROOST_HOSTS: ${OPENROOST_HOSTS:-}
      OPENROOST_PROXY_IPS: ${OPENROOST_PROXY_IPS:-}
      OPENROOST_TLS: ${OPENROOST_TLS:-on}
      OPENROOST_TLS_CERT: ${OPENROOST_TLS_CERT:-}      # e.g. /data/my.crt (your own certificate)
      OPENROOST_TLS_KEY: ${OPENROOST_TLS_KEY:-}
      OPENROOST_UPDATE_TOKEN: ${OPENROOST_UPDATE_TOKEN:-}
      OPENROOST_WIRE_STDOUT: ${OPENROOST_WIRE_STDOUT:-0}      # 1 = protocol log in `docker compose logs -f openroost`
      OPENROOST_HUB_IP: ${OPENROOST_HUB_IP:-}          # the hub's address: its port 443 -> listener redirect is kept in place
      OPENROOST_DNS: ${OPENROOST_DNS:-}                # DNS for OpenRoost's own lookups; blank = its own Pi-hole if running, else the host's
      # bundled services (only used when their profile is running)
      OPENROOST_BUNDLED_PIHOLE_URL: ${OPENROOST_BUNDLED_PIHOLE_URL:-http://127.0.0.1:${PIHOLE_WEB_PORT:-8053}/admin}
      OPENROOST_BUNDLED_PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-}
      OPENROOST_BUNDLED_PIHOLE_DNS_PORT: ${PIHOLE_DNS_PORT:-53}
      OPENROOST_BUNDLED_RELAY: ${OPENROOST_BUNDLED_RELAY:-127.0.0.1:${RELAY_PORT:-2525}}
      OPENROOST_BUNDLED_DNSMASQ_DIR: /pihole-dnsmasq
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  pihole:
    profiles: [pihole]
    image: pihole/pihole:${PIHOLE_TAG:-2026.11.0}
    container_name: openroost360-pihole
    restart: unless-stopped
    ports:
      - "${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${PIHOLE_DNS_PORT:-53}:53/udp"
      - "${PIHOLE_WEB_PORT:-8053}:80/tcp"          # Pi-hole's admin page: http://<server>:8053/admin
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-}          # required for this profile
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAMS:-9.9.9.9;149.112.112.112}
      FTLCONF_dns_listeningMode: ALL               # answer the LAN (queries arrive through Docker's network)
      FTLCONF_misc_etc_dnsmasq_d: "true"           # read OpenRoost's lines from /etc/dnsmasq.d
    volumes:
      - ./pihole/etc:/etc/pihole
      - ./pihole/dnsmasq.d:/etc/dnsmasq.d
    cap_add: [SYS_NICE]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  mailrelay:
    profiles: [mailrelay]
    image: boky/postfix:${RELAY_TAG:-latest}
    container_name: openroost360-mailrelay
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAY_PORT:-2525}:587"        # only this server (OpenRoost) can send through it
    environment:
      TZ: ${TZ:-UTC}
      RELAYHOST: ${RELAY_UPSTREAM:-[smtp.resend.com]:587}
      RELAYHOST_USERNAME: ${RELAY_USERNAME:-resend}
      RELAYHOST_PASSWORD: ${RELAY_PASSWORD:-}           # required for this profile
      ALLOWED_SENDER_DOMAINS: ${RELAY_SENDER_DOMAINS:-}     # required: your sending domain
      POSTFIX_myhostname: ${RELAY_HOSTNAME:-openroost-relay.local}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
